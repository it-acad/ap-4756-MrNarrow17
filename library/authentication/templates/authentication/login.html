{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center card glossy-card overflow-hidden">
    <div class="card-body p-4">
        <div class="card-body p-5">
            <div class="d-flex justify-content-center align-items-center mb-4 pb-1">
                <h1 class="page-title mb-0 fs-1">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </h1>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="row g-3 mb-3">
                    <div>
                        <h1 class="form-label form-label-custom">Email Address</h1>
                        <div class="input-group input-group-glossy">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                value="{{ email }}"
                                required
                            >
                        </div>
                    </div>
                    <div>
                        <h1 class="form-label form-label-custom">Password</h1>
                        <div class="input-group input-group-glossy">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                            >
                        </div>
                    </div>
                    
                </div>
                <button type="submit" class="btn btn-primary w-100 nav-link btn-auth-login d-flex justify-content-center align-items-center"><i class="bi bi-box-arrow-in-right"></i>Login</button>
            </form>
            
            <div class="text-center mt-3">
                <p class="text-white">Don't have an account? <a href="{% url 'auth:register' %}" class="deco-link text-decoration-none">Register here</a></p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

        </div>
    </div>
</div>
{% endblock %}
